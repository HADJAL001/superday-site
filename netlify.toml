# SUPER DAY — статический лендинг. Публикуется как есть (корень = папка сайта).
[build]
  publish = "."

# Мягкие security-заголовки для статики.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
