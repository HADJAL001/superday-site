name: OSGARD SSH onboarding kit quality
on:
  pull_request:
    paths: ['ops/ssh/**', '.github/workflows/ssh-onboarding-quality.yml']
  push:
    branches: [main]
    paths: ['ops/ssh/**', '.github/workflows/ssh-onboarding-quality.yml']
permissions:
  contents: read
jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test ops/ssh/onboarding.test.mjs
      - name: PowerShell parse-only validation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('ops/ssh/configure-github-secrets.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          Write-Host 'PASS PS syntax (no secrets created or read)'
