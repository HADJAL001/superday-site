# GitHub remains source of truth; Forgejo is a separate SSH delivery target.
# Never claim success if TCP, SSH, remote-ref inspection or Git push fails.
name: Delivery to OSGARD (V14 guarded Forgejo)
on:
  workflow_dispatch: {}
  push:
    branches: ['**']
  delete:
permissions:
  contents: read
concurrency:
  group: osgard-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe exact Forgejo TCP address before reading deploy credentials
        shell: bash
        run: bash scripts/forgejo-delivery.sh preflight
      - name: Install pinned Forgejo deploy identity
        env:
          KEY: ${{ secrets.OSGARD_FORGEJO_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY" ]]; then
            echo '::error title=Forgejo key unavailable::OSGARD_FORGEJO_SSH_KEY has not been configured.'
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '[64.177.120.183]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDMpvWYVzBMK8VU3+IsIrJ0KnHKK4XMdwJxzHY3HO/uL' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deliver exact GitHub branch commit to Forgejo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1
        run: bash scripts/forgejo-delivery.sh push
      - name: Delete only confirmed remote branch
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          GONE: ${{ github.event.ref }}
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1
        run: bash scripts/forgejo-delivery.sh delete
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-delivery-v14-${{ github.run_id }}
          path: forgejo_delivery_evidence.json
          if-no-files-found: warn
          retention-days: 30
