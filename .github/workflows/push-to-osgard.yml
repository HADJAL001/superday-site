# GitHub is the source of truth; Forgejo is a separate remote delivery target.
# Fail closed on TCP, SSH, SHA mismatch, or remote-ref inspection failure.
name: Delivery to OSGARD (V15 verified Forgejo)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: osgard-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSGARD_FORGEJO_HOST: ${{ secrets.OSGARD_FORGEJO_HOST }}
      OSGARD_FORGEJO_PORT: ${{ secrets.OSGARD_FORGEJO_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe exact Forgejo TCP address before reading deploy credentials
        shell: bash
        run: bash scripts/forgejo-delivery.sh preflight
      - name: Install pinned Forgejo deploy identity
        env:
          KEY: ${{ secrets.OSGARD_FORGEJO_SSH_KEY }}
          KNOWN: ${{ secrets.OSGARD_FORGEJO_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY" ]]; then
            echo '::error title=Forgejo key unavailable::OSGARD_FORGEJO_SSH_KEY has not been configured.'
            exit 1
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [[ -z "$KNOWN" ]]; then
            echo '::error title=Unverified Forgejo host::OSGARD_FORGEJO_KNOWN_HOSTS not configured.'
            exit 1
          fi
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          host_lookup="$OSGARD_FORGEJO_HOST"
          if [[ "$OSGARD_FORGEJO_PORT" != 22 ]]; then host_lookup="[$OSGARD_FORGEJO_HOST]:$OSGARD_FORGEJO_PORT"; fi
          ssh-keygen -F "$host_lookup" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo '::error title=Unverified Forgejo host::Pinned host key does not match the configured host/port.'
            exit 1
          }
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deliver immutable GitHub SHA and verify exact Forgejo ref
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1
        shell: bash
        run: bash scripts/forgejo-delivery.sh push
      - name: Delete only confirmed branch and verify remote absence
        if: github.event_name == 'delete' && github.event.ref_type == 'branch'
        env:
          GONE: ${{ github.event.ref }}
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1
        shell: bash
        run: bash scripts/forgejo-delivery.sh delete
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgejo-delivery-v15-${{ github.run_id }}
          path: forgejo_delivery_evidence.json
          if-no-files-found: warn
          retention-days: 30
