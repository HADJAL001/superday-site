name: OSGARD Seven Domains V13 Full Source Parity
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Daily read-only inventory at 09:00 UTC
  pull_request:
    paths:
      - 'scripts/inventory-premium-domains.mjs'
      - 'scripts/premium-domain-attestation.mjs'
      - 'scripts/premium-domain-attestation.test.mjs'
      - 'scripts/premium-source-pinning.test.mjs'
      - 'premium-v13-approved-indexes.json'
      - 'docs/OSGARD_PREMIUM_V13_SOURCE_PARITY.md'
      - 'docs/OSGARD_MASTER_RELEASE_PLAN.md'
      - 'docs/OSGARD_RELEASE_TRACKER_V1.json'
      - 'scripts/osgard-release-readiness.mjs'
      - 'scripts/osgard-release-readiness.test.mjs'
      - 'scripts/osgard-source-attestation.mjs'
      - 'scripts/osgard-source-attestation.test.mjs'
      - '.github/workflows/osgard-release-readiness-contract.yml'
      - '.github/workflows/premium-seven-domain-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inventory-premium-domains.mjs'
      - 'scripts/premium-domain-attestation.mjs'
      - 'scripts/premium-domain-attestation.test.mjs'
      - 'scripts/premium-source-pinning.test.mjs'
      - 'premium-v13-approved-indexes.json'
      - 'docs/OSGARD_PREMIUM_V13_SOURCE_PARITY.md'
      - 'docs/OSGARD_MASTER_RELEASE_PLAN.md'
      - 'docs/OSGARD_RELEASE_TRACKER_V1.json'
      - 'scripts/osgard-release-readiness.mjs'
      - 'scripts/osgard-release-readiness.test.mjs'
      - 'scripts/osgard-source-attestation.mjs'
      - 'scripts/osgard-source-attestation.test.mjs'
      - 'scripts/inspect-premium-hosting.mjs'
      - '.github/workflows/osgard-release-readiness-contract.yml'
      - '.github/workflows/premium-seven-domain-inventory.yml'
permissions:
  contents: read
  pull-requests: read
jobs:
  public-domain-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test strict asset, MIME, identity and SPA-fallback contracts
        run: |
          node --test scripts/premium-domain-attestation.test.mjs scripts/premium-source-pinning.test.mjs
          node --test scripts/osgard-release-readiness.test.mjs scripts/osgard-source-attestation.test.mjs
          node scripts/verify-premium-preview.mjs
      - name: Read-only HTTPS inventory of all seven public domains
        run: node scripts/inventory-premium-domains.mjs
      - name: Verify approved native GitHub source files without modifying repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/osgard-source-attestation.mjs
      - name: Produce release-readiness decision without claiming production approval
        run: node scripts/osgard-release-readiness.mjs
      - name: Inspect public hosting fingerprints (read-only)
        run: node scripts/inspect-premium-hosting.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osgard-premium-v13-seven-domain-source-parity
          path: |
            OSGARD_PREMIUM_V13_DOMAINS.json
            OSGARD_PREMIUM_V12_DOMAINS.json
            OSGARD_PREMIUM_V9_DOMAINS.json
            OSGARD_PREMIUM_HOST_FINGERPRINTS.json
            OSGARD_RELEASE_READINESS.json
            OSGARD_SOURCE_ATTESTATION_V1.json
          if-no-files-found: warn
