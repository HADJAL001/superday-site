name: OSGARD Seven Domains Inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Daily read-only inventory at 09:00 UTC
  push:
    branches: [main]
    paths:
      - 'scripts/inventory-premium-domains.mjs'
      - 'scripts/inspect-premium-hosting.mjs'
      - '.github/workflows/premium-seven-domain-inventory.yml'
permissions:
  contents: read
jobs:
  public-domain-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only HTTPS inventory of all seven public domains
        run: node scripts/inventory-premium-domains.mjs
      - name: Inspect public hosting fingerprints (read-only)
        run: node scripts/inspect-premium-hosting.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osgard-premium-v9-seven-domain-inventory
          path: |
            OSGARD_PREMIUM_V9_DOMAINS.json
            OSGARD_PREMIUM_HOST_FINGERPRINTS.json
          if-no-files-found: warn
