workflows:
  ios-testflight:
    name: SUPERDAY iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SUPERDAY App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.superday.run
      vars:
        XCODE_WORKSPACE: mobile/ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install web dependencies and sync Capacitor
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Set signing
        script: |
          xcode-project use-profiles
      - name: Build archive
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
