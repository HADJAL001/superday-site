# SUPER DAY на кластере OSGARD. Задача конфига — воспроизвести поведение
# существующих площадок (Netlify/GitHub Pages) и не сломать PWA.
#
# Про add_header: в nginx он НЕ наследуется в location, где есть собственный
# add_header — наследование работает только если во вложенном блоке нет ни
# одной такой директивы. Поймано живым прогоном образа: заголовки из server{}
# молча пропали со всех путей, где задавался Cache-Control. Поэтому
# security-заголовки повторяются в каждом блоке через include — дублирование
# здесь вынужденное и осознанное, а не небрежность.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # health-check control-plane ходит по '/', отдельная точка нужна чтобы
  # проверка не зависела от содержимого главной страницы.
  location = /healthz {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;

    # УЧЕНИЕ ОТКАТА (osgard-infra, задания 3.11/3.10) — этот блок временный и
    # будет снят следующим коммитом. Он воспроизводит самый неприятный класс
    # плохого релиза: контейнер здоров изнутри (внутренняя проверка идёт по
    # имени контейнера в Host), но снаружи, по публичному домену, отдаёт 503 —
    # то есть отказ виден только ПОСЛЕ переключения маршрута, когда трафик уже
    # ушёл на новую версию. Именно этот случай обязан заканчиваться
    # автоматическим откатом, и его надо доказать на боевом контуре, а не на
    # тестовом репозитории.
    #
    # GitHub Pages и Netlify этот файл не читают вообще (nginx есть только в
    # образе OSGARD), поэтому superday.fun коммит не затрагивает.
    if ($http_host = "superday.osgard.cloud") {
      return 503 "drill\n";
    }

    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Service worker и манифест НЕЛЬЗЯ кэшировать надолго: sw.js сам версионирует
  # кэш (superday-v40), и если браузер продолжит отдавать старый sw.js из
  # HTTP-кэша, пользователь не получит обновление сайта вообще — при статике
  # это самый дорогой класс ошибки, потому что чинится только руками у клиента.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # HTML тоже без долгого кэша: страницы ссылаются на скрипты по неизменным
  # именам (i18n.js, ux.js, refer.js — без хеша в имени), поэтому единственный
  # способ доставить правку — свежий HTML.
  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Картинки/шрифты именами не версионируются, но меняются редко — час кэша
  # даёт выигрыш и при этом обновление доезжает без вмешательства.
  # expires здесь не используется: вместе с add_header он даёт ДВА
  # заголовка Cache-Control в ответе (тоже поймано прогоном).
  location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Скрипты без хеша в имени — короткий кэш по той же причине, что и HTML.
  location ~* \.(js|css)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
  }

  # 404.html уже есть в репозитории — отдаём его, а не страницу nginx.
  error_page 404 /404.html;

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ =404;
  }
}
