# Те же заголовки, что задаёт netlify.toml для текущего прода — переезд на
# свой кластер не должен молча ослабить безопасность. Вынесены в отдельный
# файл, потому что nginx не наследует add_header в location с собственными
# add_header, и их приходится повторять в каждом блоке.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
